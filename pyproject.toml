[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-skill-ai"
version = "0.1.0"
description = "Evidence-based skill assessment and recruiter support for fresher hiring."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "ProofSkill AI Team" }
]
keywords = [
    "AI",
    "recruitment",
    "skill-assessment",
    "NLP",
    "explainable-AI"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "streamlit>=1.40,<2.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "requests>=2.32,<3.0"
]

[project.optional-dependencies]
ai = [
    "openai>=1.50,<3.0"
]
nlp = [
    "spacy>=3.8,<4.0",
    "sentence-transformers>=3.0,<6.0"
]
speech = [
    "openai-whisper>=20240930"
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0"
]
all = [
    "openai>=1.50,<3.0",
    "spacy>=3.8,<4.0",
    "sentence-transformers>=3.0,<6.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
strict_config = true
strict_markers = true
markers = [
    "unit: fast isolated unit tests",
    "integration: tests involving multiple components",
    "slow: tests that take longer to execute",
    "external: tests requiring an external service or network"
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]
ignore = [
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
